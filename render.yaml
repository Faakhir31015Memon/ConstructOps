# Render blueprint — hosted demo / production API + SPA in one Docker service.
#
#   1. Create a private GitHub repo with this code and push it.
#   2. Render -> New -> Blueprint, point it at the repo. It reads this file.
#   3. Fill the two `sync: false` secrets in the dashboard when prompted
#      (DB_URI from MongoDB Atlas, JWT_SECRET from `openssl rand -hex 32`).
#   4. After the first deploy, open the service Shell and run:
#        node scripts/seed-demo.mjs --force
#      to load the demo tenant (ALLOW_DEMO_SEED below is what permits it).
services:
  - type: web
    name: constructops
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # free instances sleep and lose the disk; do not demo on them
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_URI
        sync: false            # MongoDB Atlas srv string — never commit it
      - key: JWT_SECRET
        sync: false            # 32+ byte random hex, rotated if it ever leaks
      - key: LOG_LEVEL
        value: info
      - key: ALLOW_DEMO_SEED
        value: '1'             # set to '0' for a real paid deployment
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GATEWAY_WEBHOOK_SECRET
        sync: false            # must match the value the gateway is told to sign with
    # Report photos live on the container filesystem, which Render wipes on every
    # deploy. Attach a disk to keep them between builds:
    # disk:
    #   name: uploads
    #   mountPath: /app/uploads
    #   sizeGB: 1
